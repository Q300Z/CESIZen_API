services:
  cz-front-local:
    image: ghcr.io/q300z/cesizen-vue:dev
    container_name: cz-front-local
    ports:
      - "3000:80"  # Exposer le port 8080 pour le front
    depends_on:
      cz-api-local:
        required: true
        condition: service_healthy

  cz-api-local:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cz-api-local
    command: ["./scripts/entrypoint.sh"]
    ports:
      - "8080:8080"  # Exposer le port 8081 pour l'API
    environment:
      DB_HOST: cz-db-local
      DB_PORT: ${DB_PORT}
      GIN_MODE: release
      VERSION: dev-local
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - .:/app
    working_dir: /app
    env_file: .env
    depends_on:
      cz-api-local:
        required: true
        condition: service_healthy
    networks:
      - cz-api-local # Utiliser le réseau de la base de données pour la communication
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/v1/version || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cz-db-local:
    image: postgres:17.5-alpine3.22
    container_name: cz-db-local
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file: .env
    volumes:
      - cz_db_local:/var/lib/postgresql/data
    networks:
      - cz-db-local # Utiliser le réseau de la base de données pour la communication
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cz_db_local:
    driver: local

networks:
  cz_db_local:
    name: cz_db_local
