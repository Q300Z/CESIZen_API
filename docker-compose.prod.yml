services:
  cz-front-prod:
    image: ghcr.io/q300z/cesizen-vue:latest
    container_name: cz-front-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"  # Activer Traefik pour ce service
      - "traefik.http.routers.cz-front-prod.rule=Host(`cesizen.qalpuch.cc`)"  # Règle de routage pour le service front
      - "traefik.http.routers.cz-front-prod.entrypoints=websecure"  # Utiliser le point d'entrée HTTPS
      - "traefik.http.routers.cz-front-prod.tls.certresolver=cloudflare"  # Utiliser le résolveur de certificats Cloudflare
      - "traefik.http.services.cz-front-prod.loadbalancer.server.port=80"  # Port interne du service front
    depends_on:
      cz-api-prod:
        required: true
        condition: service_healthy
    networks:
      - traefik  # Utiliser le réseau Traefik pour la communication entre les services

  cz-api-prod:
    image: ghcr.io/q300z/cesizen-api:latest
    container_name: cz-api-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"  # Activer Traefik pour ce service
      - "traefik.http.routers.cz-api-prod.rule=Host(`cesizen-api.qalpuch.cc`)"  # Règle de routage pour le service front
      - "traefik.http.routers.cz-api-prod.entrypoints=websecure"  # Utiliser le point d'entrée HTTPS
      - "traefik.http.routers.cz-api-prod.tls.certresolver=cloudflare"  # Utiliser le résolveur de certificats Cloudflare
      - "traefik.http.services.cz-api-prod.loadbalancer.server.port=8080"  # Port interne du service API
      - "traefik.docker.network=traefik"  # Spécifier le réseau Traefik pour ce service
    env_file: .env.prod
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      cz-db-prod:
        required: true
        condition: service_healthy
    networks:
      - traefik  # Utiliser le réseau Traefik pour la communication entre les services
      - cz-db-prod # Utiliser le réseau de la base de données pour la communication
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/v1/version || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 15

  cz-db-prod:
    image: postgres:17.5-alpine3.22
    container_name: cz-db-prod
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - cz_db_prod:/var/lib/postgresql/data
    networks:
      - cz-db-prod # Utiliser le réseau de la base de données pour la communication
    healthcheck:
        test: ["CMD-SHELL", "pg_isready"]
        interval: 10s
        timeout: 5s
        retries: 5
volumes:
  cz_db_prod:
    driver: local

networks:
  cz-db-prod:
    name: cz-db-prod
  traefik:
    external: true
